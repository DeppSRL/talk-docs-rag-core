[project]
name = "talk-docs-rag-core"
version = "0.1.0"
description = "Nucleo RAG grounded: retrieval ibrido, rifiuto deterministico, citazioni verificate, harness di valutazione"
readme = "README.md"
requires-python = ">=3.11"

# Solo il nucleo. Niente FastAPI, niente typer, niente auth: lo strato applicativo è del
# consumatore — è il motivo per cui la demo si fa in talk-docs, dove esiste già.
dependencies = [
    "openai>=1.40",       # client OpenAI-compatible (Mistral La Plateforme e simili)
    "chromadb>=0.5.0",
    "whoosh>=2.7.4",
    "tiktoken>=0.7.0",    # chunking token-based
    "pydantic>=2.7",
    "duckdb>=1.0.0",      # query simbolica sui metadati: la query È l'artefatto di citazione
    "pypdf>=4.2.0",
    "beautifulsoup4>=4.12.0",
]

# `python-dotenv` NON è una dipendenza: caricare un `.env` è un comportamento
# dell'applicazione, non della libreria. `RagConfig.from_env()` legge l'ambiente; chi vuole
# un `.env` lo carica prima, come fa il PoC.

# Servono al pacchetto quando è un repository per conto suo: là `uv sync --group dev` e
# `uv run pytest` devono bastare, senza che nessuno ricordi di aggiungerli a mano.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talk_docs_rag_core"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Quando il pacchetto è un repository per conto suo, ruff gira dalla sua radice e senza
# questa riga non riconosce `talk_docs_rag_core` come first-party: lo ordina fra le
# dipendenze di terze parti, e l'ordinamento degli import diverge fra i due repository
# sugli stessi file. Un lint che dà due risposte diverse sullo stesso codice smette di
# essere un lint.
src = ["src"]
# `retrieval/` è copia dal commit pinnato di talk-docs (vedi src/.../retrieval/NOTICE): non
# lo riformattiamo, per tenere leggibile il diff verso l'origine finché la direzione si
# inverte del tutto.
extend-exclude = ["src/talk_docs_rag_core/retrieval/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
